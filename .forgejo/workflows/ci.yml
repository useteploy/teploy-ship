name: CI
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Claim ledger check (S20)
        run: node scripts/claim-ledger.mjs --check

      - name: Flag reference check (O4)
        run: node scripts/flag-reference.mjs --check

      # 2026-10-18 guard: the image must compile dist/ and web/dist/ from the
      # source in its build context; a Dockerfile or ignore-file change that
      # goes back to copying host build outputs fails here.
      - name: Image compiles from source
        run: node scripts/check-image-sources.mjs

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Ship build + tests
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir web install --frozen-lockfile
          pnpm test

      - name: Web production build
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm run build
