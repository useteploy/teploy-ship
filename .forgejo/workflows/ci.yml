name: CI
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Ship build + tests
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir web install --frozen-lockfile
          pnpm test

      - name: Web production build
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm run build
