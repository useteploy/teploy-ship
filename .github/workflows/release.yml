name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  # Required to mint the provenance attestation below.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@10

      # The release path used to build and push WITHOUT running the tests, so
      # "tagged" carried no more assurance than "committed". A tag is the point
      # where that matters most.
      - name: Lint + tests
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm test

      - name: Web typecheck + tests
        run: |
          cd web
          pnpm install --frozen-lockfile
          npx tsc --noEmit
          pnpm test

      - name: Secret scan
        run: node scripts/scan-secrets.mjs

      - name: Build ship
        run: pnpm run build

      - name: Build web
        run: |
          cd web
          pnpm run build

      - uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ghcr.io/${{ github.repository }}
          # `stable` is the tag the public template and README actually deploy,
          # so a release that does not move it changes nothing for anyone
          # installing Ship. It was hand-flipped for v0.2.0 and then missed for
          # v0.2.1, which shipped with `stable` still serving the pre-fix build.
          # A prerelease tag (v1.2.3-rc1) must not move it.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=raw,value=stable,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest

      - name: Build and push
        id: push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # An SBOM and provenance travel with the image, so "what is in the
          # thing running in production" is answerable after the fact.
          sbom: true
          provenance: mode=max

      - name: Attest provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@e7a8f85e1c67a31e6ed99a94b41bd0b71bbee6b8 # v2.0.9
        with:
          generate_release_notes: true
