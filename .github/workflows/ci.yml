name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Ship build + tests
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm test

      - name: Web production build
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm run build
