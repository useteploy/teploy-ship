# infra-home overlay: Ship's CONTROL PLANE beside the forge, sandboxes elsewhere.
#
#   teploy deploy -d home
#
# WHY THIS IS SAFE, AND WHY IT WOULD NOT HAVE BEEN BEFORE.
#
# infra-home runs Forgejo. Ship executes code a model wrote, and its sandbox
# egress allowlist permits the forge by design — a run has to clone and push.
# What must not share a machine with the forge is therefore the SANDBOX, not
# the worker: the worker process runs Ship's own TypeScript and holds
# credentials wherever it lives, while the sandbox is where the model's code
# actually runs.
#
# So this overlay is only correct in combination with SHIP_SANDBOX_URL pointing
# at another box. src/colocation.ts enforces exactly that at worker startup:
# with a remote pool it starts, and if a sandbox daemon ever resolves to the
# forge's machine it refuses and says so. Do not point SHIP_SANDBOX_URL at a
# local daemon here.
#
# This is the Forgejo Actions shape — forge and coordinator together, runners
# on their own box — and it is why compute-1 exists.
server: 100.108.123.49
# infra-home runs as root (servers.yml records it that way; the box has no
# `tyler` account).
user: root
ingress: host

# The dashboard binds the TAILNET address only, matching observe's reasoning on
# this same host: the box has no public interface, but 0.0.0.0 would put an
# approve/deny surface on the whole home LAN with no host firewall in front of
# it (INPUT policy is ACCEPT, no ufw/nft). Approving a run is remote code
# execution plus spend authorization, so the interface bind is the control that
# actually exists here.
bind: 100.108.123.49

env:
  # Ship's own address, for the cross-product nav and for links it writes into
  # pull requests.
  SHIP_PUBLIC_URL: "http://100.108.123.49:7460"

  # THE LOAD-BEARING LINE. compute-1 runs the sandbox daemon and the Forgejo
  # Actions runner; nothing model-authored executes on infra-home. It is a
  # comma-separated LIST (B2) — adding a second compute box is appending an
  # address, and each run is placed on the least-loaded healthy daemon.
  SHIP_SANDBOX_URL: "http://100.107.192.39:7439"
  SHIP_SANDBOX_IMAGE: ship-sandbox-harness:dev
  SHIP_SANDBOX_NETWORK: egress

  # Concurrency is pinned rather than derived, and this is a KNOWN GAP being
  # worked around: B1's sensing measures the box the WORKER runs on, which is
  # now infra-home (4 cpu / 30 GB, idle) — not compute-1 (4 cpu / 8 GB, shared
  # with Actions), which is where the sandboxes actually consume resources. The
  # derived ceiling would therefore be a number about the wrong machine.
  # Two is what compute-1 can carry alongside a CI build; raise it once the
  # sensing understands remote pools.
  SHIP_MAX_CONCURRENT_RUNS: "2"

  # Cross-product switcher siblings (tailnet; these have no public domain).
  TEPLOY_NAV_DASH_URL: "http://100.108.123.49:3456"
  TEPLOY_NAV_OBSERVE_URL: "http://100.108.123.49:3000"
