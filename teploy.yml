# Self-hosted Teploy Ship — deployed with teploy.
#
# One image (deploy/build-image.sh), two processes:
#   web     the dashboard + webhook receivers (Forgejo + GitHub)
#   worker  executes durable runs (needs the model + git tokens)
# Nucleus runs as a teploy accessory (network alias `<app>-nucleus`, i.e.
# ship-nucleus) so any machine can list/approve runs against it.
#
# No domain: `ingress: host` publishes the web process directly at
# <server-ip>:7460 — the shape for a private/tailnet box. Gate the port
# with your firewall (e.g. `ufw allow from 100.64.0.0/10 to any port 7460`
# for Tailscale-only access).
#
# Required secrets — set ONCE via `teploy secret set` from this directory
# (never put values in this file):
#   SHIP_WEB_TOKEN       dashboard login + API bearer      (web only)
#   SHIP_WEBHOOK_SECRET  Forgejo/GitHub webhook HMAC       (web only)
#   SHIP_SESSION_SECRET  signs dashboard sessions          (web only)
#   SHIP_GIT_TOKEN       deploy token for repo runs        (worker only)
#   SHIP_SANDBOX_TOKEN   sandbox daemon credential         (worker only)
#   AI_GATEWAY_KEY       project key from `teploy-gateway key create` (worker only)
#     (or set ANTHROPIC_API_KEY instead and drop AI_GATEWAY_URL below)
#
# LEAST PRIVILEGE: teploy secrets are app-scoped — `processes:` takes a
# command string, so there is no per-process secret scoping to declare here —
# and they therefore land in BOTH containers. The web process has no use for
# the git deploy token or the model key: it renders a dashboard and verifies
# webhook signatures; it never clones, never pushes, and never calls a model.
#
# Ship handles that itself rather than waiting for the platform: `teploy-ship
# web` DROPS worker-only credentials from the environment before serving (see
# WORKER_ONLY_SECRETS in src/cli.ts), so a web-route bug cannot read a value
# that is not there. Nothing to configure; noted here because the deployed
# container will still show them in `teploy secret list`.
#
# Repository access (worker). Prefer the per-origin form — it names the
# credential AND the origins Ship may clone, so there is nothing else to set:
#   SHIP_GIT_TOKENS={"https://github.com":"ghp_…"}
# The single-token SHIP_GIT_TOKEN still works, but because it has no host
# attached it also needs SHIP_REPO_ALLOWLIST to say where it may be sent —
# otherwise a repository URL arriving from a webhook, a Slack message, or an
# issue body is refused rather than being handed the token.

app: ship
server: smoke # your server name from servers.yml (smoke = the dev test box)
user: tyler
ingress: host
port: 7460
platform: linux/amd64

# No image: teploy syncs this directory (see .teployignore) and builds
# from the root Dockerfile ON the server. Prerequisites, run locally
# first: `pnpm run build`, `cd web && pnpm run build`, and the SDK
# tarball pack from deploy/build-image.sh (the @neutron-build packages
# are ahead of their npm releases, so the image installs them from
# deploy/vendor/ tarballs).

processes:
  web: web --store nucleus --port 7460
  worker: worker --store nucleus --interval 5

# Ceiling per app container (web and worker each), not a reservation — they sit
# at ~140 MB and ~30 MB respectively, because durable-run work happens inside
# the sandbox container rather than in the worker process. This exists so a leak
# or a runaway run cannot take the whole 4 GB box down with it, which on this
# host would also mean the gateway and the Forgejo runner.
memory: 1g

# Nucleus sidecar. NUCLEUS_ALLOW_NO_AUTH: nucleus's pgwire SCRAM password
# auth panics upstream ("Salt required for SCRAM auth source"), so
# password auth is not usable yet; the accessory is only reachable on the
# app's private docker network. Same posture observe's teploy.yml ships.
accessories:
  nucleus:
    # PINNED, not :latest. Nucleus publishes :latest on every push to main, so a
    # redeploy would silently adopt whatever landed since — and a storage engine
    # is the last thing that should change underneath you unannounced.
    #
    # v0.1.8 (2026-08-21) supersedes v0.1.5. It keeps the 2026-08-03 KV/LSM
    # memory rework that fixed the write-reject-under-memory-pressure outage,
    # and adds the run of durability fixes released in 0.1.7/0.1.8 — several
    # acked-but-unfsynced writes, three confirmed CRITICALs, and streaming
    # routes that bypassed column masking and the SELECT grant.
    #
    # The concrete reason to move off v0.1.5: it cannot bootstrap a fresh
    # Observe schema. Migration 28 fails with `events_pre028 not found in
    # storage`, so a new install or a restore that replays the schema cannot
    # come up. Verified on 2026-08-21 that Observe's suite passes against
    # v0.1.8 (34 packages) and fails three of them against v0.1.5.
    # Bump deliberately, after an instance has proven a release.
    image: ghcr.io/neutron-build/nucleus:v0.1.8
    port: 5432
    # Hard cgroup cap. NUCLEUS_MAX_MEMORY_MB below is the engine's own
    # accounting and is advisory — it was set to 16 GB on the day this engine
    # reached 30 GB RSS and OOM-killed an unrelated service on the same host.
    # Set above the engine budget so the engine's graceful eviction gets to run
    # first, and the kernel cap is only the backstop.
    memory: 1500m
    env:
      NUCLEUS_ALLOW_NO_AUTH: "1"
      NUCLEUS_ALLOW_INSECURE_CLUSTER: "1"
      NUCLEUS_ALLOW_INSECURE_REPLICATION: "1"
      # Engine-wide memory budget (honored by nucleus >= 56a7f59; the engine
      # rejects writes at 90% RSS of this, and its 512 MB default is too
      # tight once real data is resident). Smoke box has 4 GB total.
      NUCLEUS_MAX_MEMORY_MB: "1024"
    volumes:
      nucleus-data: /data

env:
  NUCLEUS_URL: postgres://nucleus@ship-nucleus:5432/nucleus
  SHIP_MODEL: anthropic/claude-sonnet-5
  # Codebase indexing (A1): repo runs embed the clone into Nucleus vectors
  # and the agent gets the ```search action. Embeddings ride the gateway's
  # /v1/embeddings passthrough to its ollama accessory (nomic-embed-text,
  # pulled once — see teploy-gateway/teploy.yml). Unset to disable indexing.
  SHIP_EMBED_MODEL: ollama/nomic-embed-text
  # Route model calls through teploy-gateway, deployed as its own internal
  # teploy service (see teploy-gateway/teploy.yml) — reachable on the teploy
  # network at its app-name alias. Drop this to call providers directly.
  AI_GATEWAY_URL: http://ship-gateway:8089
  # Auto-launch is OFF by default — a labeled issue only ever becomes a
  # PROPOSED task you launch from the dashboard. To let the worker launch
  # a source's tasks without a click, set (via `teploy secret set`, not
  # here — earn it deliberately per source):
  #   SHIP_INTAKE_POLICIES={"forgejo":"auto"}
  # The daily count cap, concurrency ceiling, and per-source spend budget
  # still bound it (SHIP_DAILY_BUDGET_USD, SHIP_MAX_CONCURRENT_RUNS).
  #
  # SHIP_MAX_STEPS caps how many model turns one durable run gets (default
  # 40). Raise it for repos where tasks need more exploration; the spend
  # caps above are what actually bound cost.
  #
  # SHIP_HARNESS picks what edits the tree: native (default, Ship's own loop,
  # needs nothing in the sandbox image), claude-code or opencode (the vendor
  # binary must be in SHIP_SANDBOX_IMAGE and the sandbox needs egress). It is
  # recorded on each run at enqueue. See docs/adapters.md — including why a
  # subscription-fed run is counted as unpriced rather than shown as $0.
  #
  # Run durable worker tasks in a teploy-sandbox container (instead of the
  # slim worker image, which has no python/curl) so repo tasks whose tests
  # need other tools can complete. The daemon is a host systemd service, so
  # containers reach it at the teploy bridge gateway (172.18.0.1). Set
  # SHIP_SANDBOX_TOKEN via `teploy secret set`.
  SHIP_SANDBOX_URL: http://172.18.0.1:7439
  SHIP_SANDBOX_IMAGE: golang:1.24
  SHIP_SANDBOX_NETWORK: egress

  # --- Evidence on the pull request (P1) ---------------------------------
  # Each of these only ASKS. Whether the evidence can actually be produced is
  # the worker's own configuration, and a leg that is not configured records
  # itself as disabled rather than failing the run. A worker wired for none of
  # them adds nothing to the PR at all, deliberately: printing "not deployed,
  # not measured, not tested" on every pull request trains a reviewer to skip
  # the section that sometimes carries the real thing.
  #
  # Ship runs the suite itself, after the agent stops and BEFORE the push, so
  # "tests passed" describes the code that becomes the PR. The agent's own
  # account of its testing is exactly the claim the finish gate exists because
  # models get wrong.
  #
  # CAVEAT: SHIP_TEST_COMMAND is the worker-wide DEFAULT, used for repos with
  # no per-repo evidence entry. Per-repo config exists — `teploy-ship evidence
  # set <repo> --test-command "..." --observe-service <svc>` — and wins over
  # this value, so one worker can serve repos with different suites. A command
  # the sandbox image cannot run reports "not run", never "failed".
  SHIP_TESTS: "1"
  SHIP_TEST_COMMAND: "go test ./..."

  # Read the affected service's error rate and latency either side of the
  # change and put the numbers on the PR. Below OBSERVE_MIN_REQUESTS in either
  # window it says "not enough data to compare" and shows raw counts instead —
  # a preview environment serves almost nothing, so that is the common case and
  # the refusal IS the feature. Where a comparison is reported it is labelled
  # correlation; nothing claims causation.
  #
  # These three are the worker-wide DEFAULT (used for repos with no per-repo
  # evidence entry). A repo's own service is configured per repo:
  #   teploy-ship evidence set tyler/fylun --observe-service fylun-web
  # which also makes the run read THAT service regardless of OBSERVE_SERVICE.
  #
  # OBSERVE_READ_TOKEN is a share token and is set via `teploy secret set`.
  SHIP_TELEMETRY: "1"
  OBSERVE_URL: http://100.108.123.49:3000
  OBSERVE_SERVICE: fylun-web
  # Without a repo (here OR in per-repo evidence) the leg is OFF, by design:
  # on 2026-08-21 a worker watching fylun-web put its RED metrics on a pull
  # request that changed one line of Go in an unrelated repo, and the reviewer
  # saw "p95 up 2653ms" under a change that could not have caused it.
  OBSERVE_REPO: tyler/fylun

# Durable state for the worker's file paths (nucleus mode needs little,
# but the image declares VOLUME /data).
volumes:
  ship-data: /data
